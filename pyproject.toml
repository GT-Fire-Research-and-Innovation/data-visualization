[project]
name = "firevis"
version = "0.1.0"
description = "Visualize TS-SatFire data before and after processing"
requires-python = ">=3.9"
dependencies = [
    "huggingface_hub>=0.20",
    "ipywidgets>=7.6",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firevis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
