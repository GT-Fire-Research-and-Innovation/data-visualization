[project]
name = "firevis"
version = "0.1.0"
description = "Visualize TS-SatFire data before and after processing"
requires-python = ">=3.9"
dependencies = [
    "huggingface_hub>=0.20",
    "ipywidgets>=7.6",
    "numpy",
]

[project.optional-dependencies]
# GeoTIFF fire folders need rasterio; window .npz archives use Zstandard, which
# Python < 3.14 reads through backports.zstd. Colab: %pip install rasterio backports.zstd
imagery = ["rasterio", "pillow", "matplotlib", "backports.zstd; python_version<'3.14'"]
test = ["pytest", "pandas", "rasterio", "pillow", "matplotlib", "backports.zstd; python_version<'3.14'"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firevis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
